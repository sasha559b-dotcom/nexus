<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Нексус — Мессенджер</title>
<meta name="theme-color" content="#0C0C18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Нексус">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="manifest-placeholder">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090F;--bg2:#111120;--bg3:#1A1A2E;
  --accent:#A78BFA;--accent2:#C4B5FD;--accent-d:#2D1B69;
  --text:#F0F0F8;--sub:#6B6B90;--border:#222238;
  --online:#4ADE80;--msg-out:#2D1B69;--msg-in:#1A1A2E;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;position:fixed;width:100%;overscroll-behavior:none}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s ease;will-change:transform;overflow:hidden}
.screen.off-right{transform:translateX(100%);opacity:0;pointer-events:none}
.screen.off-left{transform:translateX(-28%);opacity:0;pointer-events:none}

/* LOGIN */
#s-login{align-items:center;justify-content:center;padding:32px 24px;background:radial-gradient(ellipse at 50% 0%,#1E1040 0%,var(--bg) 70%)}
.lglow{position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.15) 0%,transparent 70%);pointer-events:none}
.llogo{width:84px;height:84px;background:linear-gradient(135deg,#6D28D9,#A78BFA);border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:22px;box-shadow:0 24px 64px rgba(109,40,217,.45),0 0 0 1px rgba(167,139,250,.2);animation:lf 3s ease-in-out infinite}
@keyframes lf{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lh{font-size:30px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#fff 40%,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;text-align:center}
.ls{color:var(--sub);font-size:15px;margin-bottom:40px;text-align:center}
.al{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.ac{display:flex;align-items:center;gap:16px;background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:16px 20px;cursor:pointer;transition:border-color .2s,transform .15s,background .15s}
.ac:hover{border-color:var(--accent)}.ac:active{transform:scale(.97);background:var(--bg3)}
.aa{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.ai{flex:1}.an{font-size:17px;font-weight:700}.at{font-size:13px;color:var(--sub);margin-top:2px}
.arr{color:var(--sub);font-size:20px}

/* HEADER */
.hdr{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 12px) 16px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;min-height:60px}
.hbk{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent2);font-size:26px;transition:background .2s;flex-shrink:0}
.hbk:active{background:var(--bg3)}
.hav{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;position:relative}
.hav .dot{position:absolute;bottom:1px;right:1px;width:12px;height:12px;background:var(--online);border-radius:50%;border:2px solid var(--bg2)}
.hi{flex:1;min-width:0}
.hn{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs{font-size:12px;color:var(--sub);margin-top:1px}.hs.on{color:var(--online)}
.htl{font-size:22px;font-weight:800;flex:1;letter-spacing:-.3px}
.hbt{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:19px;flex-shrink:0;transition:background .2s;color:var(--sub)}
.hbt:active{background:var(--bg3)}

/* SEARCH */
.sw{padding:10px 16px 12px;flex-shrink:0;background:var(--bg2)}
.si{background:var(--bg3);border-radius:14px;display:flex;align-items:center;gap:10px;padding:10px 14px}
.si input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;font-family:inherit}
.si input::placeholder{color:var(--sub)}

/* CHAT LIST */
.cl{flex:1;overflow-y:auto;overscroll-behavior:contain}.cl::-webkit-scrollbar{display:none}
.ci{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;transition:background .15s}
.ci:active{background:var(--bg2)}
.cia{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;position:relative}
.cia .od{position:absolute;bottom:1px;right:1px;width:14px;height:14px;background:var(--online);border-radius:50%;border:2.5px solid var(--bg)}
.cib{flex:1;min-width:0}
.cit{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.cin{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctm{font-size:12px;color:var(--sub);flex-shrink:0}
.cbot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.clst{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clst .bld{color:var(--text);font-weight:600}
.ubdg{min-width:22px;height:22px;background:var(--accent);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:0 7px;flex-shrink:0;color:#fff}
.dv{height:1px;background:var(--border);margin:0 16px 0 84px}
.emp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--sub);padding:40px}
.emp .ei{font-size:60px;opacity:.3}.emp .et{font-size:16px;text-align:center;line-height:1.5}

/* MESSAGES */
.ml{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.ml::-webkit-scrollbar{display:none}
.dsep{text-align:center;font-size:12px;color:var(--sub);margin:10px 0;position:relative}
.dsep::before,.dsep::after{content:'';position:absolute;top:50%;width:calc(50% - 70px);height:1px;background:var(--border)}
.dsep::before{left:0}.dsep::after{right:0}
.stag{font-size:12px;font-weight:700;margin-bottom:4px;margin-left:38px}
.mr{display:flex;align-items:flex-end;gap:8px;animation:mi .18s ease}
.mr.out{flex-direction:row-reverse}
@keyframes mi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.mav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-bottom:2px}
.mav.inv{visibility:hidden}
.bub{max-width:74%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.45;word-break:break-word;position:relative}
.bub.ibub{padding:5px;overflow:hidden;cursor:pointer}
.bub.ibub img{max-width:220px;max-height:260px;border-radius:16px;display:block;object-fit:cover;width:100%}
.mr.in  .bub{background:var(--msg-in);border-bottom-left-radius:5px}
.mr.out .bub{background:var(--msg-out);border-bottom-right-radius:5px;color:#f0e8ff}
.bm{display:flex;align-items:center;gap:4px;font-size:11px;color:rgba(255,255,255,.4);margin-top:5px;justify-content:flex-end}
.bub.ibub .bm{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:10px;margin-top:0;color:rgba(255,255,255,.85)}
.mr.in .bm{color:var(--sub)}
.bck{font-size:12px}.bck.rd{color:var(--accent2)}
.empm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--sub)}
.empm .ei{font-size:52px;opacity:.25}.empm .et{font-size:15px}

/* INPUT */
.ib{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;padding-bottom:calc(10px + var(--safe-b));background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;position:relative}
.pbt{width:44px;height:44px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:21px;flex-shrink:0;transition:background .2s}
.pbt:active{background:var(--accent-d)}
.iw{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:22px;display:flex;align-items:flex-end;padding:10px 16px;min-height:46px;max-height:120px;transition:border-color .2s}
.iw:focus-within{border-color:var(--accent)}
#minput{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:16px;font-family:inherit;resize:none;max-height:80px;line-height:1.4}
#minput::placeholder{color:var(--sub)}
.sbt{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#6D28D9,#A78BFA);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:20px;transition:transform .15s,opacity .15s,box-shadow .15s;box-shadow:0 6px 20px rgba(109,40,217,.4)}
.sbt:active{transform:scale(.9)}.sbt.off{opacity:.35;box-shadow:none;pointer-events:none}
.upind{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg3);border-radius:14px;margin:0 12px 8px;font-size:13px;color:var(--sub);flex-shrink:0}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* PROFILE */
.pc{flex:1;overflow-y:auto;padding:24px 20px 40px}.pc::-webkit-scrollbar{display:none}
.ph{display:flex;flex-direction:column;align-items:center;margin-bottom:28px}
.pba{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:16px;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.pn{font-size:26px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px}
.pt{font-size:15px;color:var(--sub);display:flex;align-items:center;gap:6px}
.pt .onl{color:var(--online)}
.ps{background:var(--bg2);border-radius:18px;overflow:hidden;margin-bottom:14px;border:1px solid var(--border)}
.pr{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.pr:last-child{border-bottom:none}.pr:active{background:var(--bg3)}
.pri{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.prt{flex:1}.prl{font-size:15px;font-weight:600}.prv{font-size:13px;color:var(--sub);margin-top:2px}
.prc{color:var(--sub);font-size:18px}
.swb{width:100%;padding:17px;background:linear-gradient(135deg,#4C1D95,#6D28D9,#7C3AED);border-radius:16px;font-size:16px;font-weight:700;text-align:center;cursor:pointer;margin-top:10px;transition:opacity .2s,transform .15s;box-shadow:0 10px 30px rgba(109,40,217,.35)}
.swb:active{opacity:.85;transform:scale(.98)}

/* INSTALL CARD */
.icard{background:linear-gradient(135deg,#1E1040,#2D1B69);border:1px solid rgba(167,139,250,.25);border-radius:18px;padding:18px;margin-bottom:14px}
.ict{font-size:16px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.ics{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.ics-step{display:flex;align-items:flex-start;gap:12px;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px}
.snum{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;margin-top:1px}
.stxt{font-size:13px;line-height:1.5}

/* TABS */
.tabs{display:flex;background:var(--bg2);border-top:1px solid var(--border);padding-bottom:var(--safe-b);flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px;cursor:pointer;gap:4px;color:var(--sub);transition:color .2s}
.tab.active{color:var(--accent2)}
.tico{font-size:22px}.tlbl{font-size:10px;font-weight:700;letter-spacing:.3px}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(30,30,50,.95);backdrop-filter:blur(12px);color:var(--text);padding:10px 20px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:9999;border:1px solid var(--border);max-width:calc(100vw - 40px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* EMOJI PICKER */
.epick{position:absolute;bottom:calc(100% + 8px);right:0;left:0;background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:10px;display:none;flex-wrap:wrap;gap:4px;z-index:100;max-height:200px;overflow-y:auto;box-shadow:0 -8px 32px rgba(0,0,0,.4)}
.epick.open{display:flex}
.epick span{font-size:26px;cursor:pointer;padding:4px;border-radius:10px;transition:background .15s;line-height:1}
.epick span:active{background:var(--bg3)}
.ecats{display:flex;gap:4px;margin-bottom:8px;width:100%;overflow-x:auto;padding-bottom:4px}
.ecats::-webkit-scrollbar{display:none}
.ecat{font-size:18px;cursor:pointer;padding:4px 8px;border-radius:10px;flex-shrink:0;transition:background .15s}
.ecat.active{background:var(--accent-d)}

.ivw{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9998;display:none;align-items:center;justify-content:center}
.ivw.open{display:flex}
.ivw img{max-width:94vw;max-height:88vh;border-radius:10px;object-fit:contain}
.ivwc{position:absolute;top:calc(var(--safe-t)+16px);right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen" id="s-login">
  <div class="lglow"></div>
  <div class="llogo">⚡</div>
  <div class="lh">Нексус</div>
  <div class="ls">Выберите аккаунт для входа</div>
  <div class="al" id="acc-list"></div>
</div>

<!-- CHATS -->
<div class="screen off-right" id="s-chats">
  <div class="hdr">
    <div class="htl">Чаты</div>
    <div class="hbt" onclick="goProfile()">👤</div>
  </div>
  <div class="sw"><div class="si">
    <span style="font-size:17px;opacity:.5">🔍</span>
    <input placeholder="Поиск..." id="srch" oninput="doSearch(this.value)">
  </div></div>
  <div class="cl" id="chat-list"></div>
  <div class="tabs">
    <div class="tab active"><div class="tico">💬</div><div class="tlbl">ЧАТЫ</div></div>
    <div class="tab" onclick="goProfile()"><div class="tico">👤</div><div class="tlbl">ПРОФИЛЬ</div></div>
  </div>
</div>

<!-- CHAT -->
<div class="screen off-right" id="s-chat">
  <div class="hdr">
    <div class="hbk" onclick="goBack()">‹</div>
    <div class="hav" id="ch-ava"></div>
    <div class="hi">
      <div class="hn" id="ch-name"></div>
      <div class="hs" id="ch-status"></div>
    </div>
    <div class="hbt">📞</div>
    <div class="hbt">⋯</div>
  </div>
  <div class="ml" id="msg-list"></div>
  <div class="upind" id="up-ind" style="display:none">
    <div class="spin"></div><span>Обработка фото...</span>
  </div>
  <div class="ib">
    <div id="epicker" class="epick"></div>
    <div class="pbt" onclick="triggerPhoto()" title="Отправить фото">📷</div>
    <input type="file" id="file-inp" accept="image/*" style="display:none" onchange="onFileSel(this)">
    <div class="iw">
      <textarea id="minput" placeholder="Сообщение..." rows="1"
        oninput="onInp(this)" onkeydown="onKey(event)"></textarea>
      <div onclick="toggleEmoji()" style="font-size:22px;cursor:pointer;padding:0 2px;flex-shrink:0;opacity:.7;transition:opacity .2s;line-height:1" title="Эмодзи">🙂</div>
    </div>
    <div class="sbt off" id="sbtn" onclick="sendMsg()">➤</div>
  </div>
</div>

<!-- PROFILE -->
<div class="screen off-right" id="s-profile">
  <div class="hdr">
    <div class="hbk" onclick="goBack()">‹</div>
    <div class="htl">Профиль</div>
  </div>
  <div class="pc" id="pcontent"></div>
</div>

<!-- IMAGE VIEWER -->
<div class="ivw" id="img-viewer" onclick="closeViewer()">
  <div class="ivwc">✕</div>
  <img id="viewer-img" src="">
</div>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────
const ACCOUNTS=[
  {id:'alice',  name:'Алиса', emoji:'👩',color:'#7C3AED',tag:'@alice',  bio:'Люблю путешествия и кофе ☕'},
  {id:'bob',    name:'Боб',   emoji:'👨',color:'#0EA5E9',tag:'@bob',    bio:'Программист. Код и музыка 🎵'},
  {id:'charlie',name:'Чарли', emoji:'🧑',color:'#10B981',tag:'@charlie',bio:'Дизайнер интерфейсов 🎨'},
];
const CHATS=[
  {id:'dm_ab', type:'dm',   members:['alice','bob'],            name:null,          emoji:null},
  {id:'dm_ac', type:'dm',   members:['alice','charlie'],        name:null,          emoji:null},
  {id:'dm_bc', type:'dm',   members:['bob','charlie'],          name:null,          emoji:null},
  {id:'grp',   type:'group',members:['alice','bob','charlie'],  name:'Общий чат 💬',emoji:'👥'},
];
const SEED={
  dm_ab:[
    {sid:'alice',text:'Привет, Боб! 👋',ts:Date.now()-18000000},
    {sid:'bob',  text:'Привет! Как дела?',ts:Date.now()-17998000},
    {sid:'alice',text:'Отлично! Ты слышал про наш проект?',ts:Date.now()-14400000},
    {sid:'bob',  text:'Нет ещё, расскажи!',ts:Date.now()-14396000},
    {sid:'alice',text:'Запускаем мессенджер с отправкой фото 📸',ts:Date.now()-10800000},
    {sid:'bob',  text:'Круто! Буду рад помочь 🚀',ts:Date.now()-10798000},
  ],
  dm_ac:[
    {sid:'charlie',text:'Алиса, глянь мой дизайн!',ts:Date.now()-7200000},
    {sid:'alice',  text:'Вау, потрясающе 🔥',ts:Date.now()-7196000},
    {sid:'charlie',text:'Спасибо! Доработаю ещё чуть',ts:Date.now()-3600000},
  ],
  dm_bc:[
    {sid:'bob',    text:'Чарли, подправишь иконки?',ts:Date.now()-25200000},
    {sid:'charlie',text:'Конечно, к вечеру пришлю 👌',ts:Date.now()-25196000},
    {sid:'bob',    text:'Отлично, спасибо! 🙌',ts:Date.now()-3600000},
  ],
  grp:[
    {sid:'alice',  text:'Всем привет в общем чате! 🎉',ts:Date.now()-86400000},
    {sid:'bob',    text:'Привет всем! 😊',ts:Date.now()-86398000},
    {sid:'charlie',text:'Ура, есть общий чат!',ts:Date.now()-86396000},
    {sid:'alice',  text:'Встреча сегодня в 15:00 🗓️',ts:Date.now()-7200000},
    {sid:'bob',    text:'✅ Буду!',ts:Date.now()-3600000},
    {sid:'charlie',text:'Я тоже 👍',ts:Date.now()-1800000},
  ],
};

// ─── STATE ────────────────────────────────────────
let ME=null,curChat=null,msgs={},pollId=null,srchQ='',imgCache={},onlineUsers=new Set();

// ─── STORAGE ──────────────────────────────────────
const S={
  async get(k){
    try{if(window.storage){const r=await window.storage.get(k,true);return r?r.value:null;}}catch(e){}
    return localStorage.getItem(k);
  },
  async set(k,v){
    try{if(window.storage){await window.storage.set(k,v,true);return;}}catch(e){}
    localStorage.setItem(k,v);
  }
};

// ─── HELPERS ──────────────────────────────────────
const acc =id=>ACCOUNTS.find(a=>a.id===id);
const chat=id=>CHATS.find(c=>c.id===id);
function cName(c,u){return c.type==='group'?c.name:acc(c.members.find(m=>m!==u))?.name||'?'}
function cEmoji(c,u){return c.type==='group'?c.emoji||'👥':acc(c.members.find(m=>m!==u))?.emoji||'👤'}
function cColor(c,u){return c.type==='group'?'#6D28D9':acc(c.members.find(m=>m!==u))?.color||'#555'}
function fmtT(ts){
  const d=new Date(ts),n=new Date();
  if(sDay(ts,n))return d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
  if(n-d<604800000)return d.toLocaleDateString('ru',{weekday:'short'});
  return d.toLocaleDateString('ru',{day:'2-digit',month:'2-digit'});
}
function fmtD(ts){return new Date(ts).toLocaleDateString('ru',{day:'numeric',month:'long'})}
function sDay(a,b){const da=new Date(a),db=new Date(b);return da.getDate()===db.getDate()&&da.getMonth()===db.getMonth()&&da.getFullYear()===db.getFullYear()}
function toast(t,d=2500){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),d)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}

// ─── DATA ─────────────────────────────────────────
async function loadAll(){
  for(const c of CHATS){const r=await S.get('nx2_'+c.id);msgs[c.id]=r?JSON.parse(r):[];}
}
async function saveChat(cid){await S.set('nx2_'+cid,JSON.stringify(msgs[cid]))}
async function seedIfEmpty(){
  if(await S.get('nx2_seeded'))return;
  for(const[cid,list]of Object.entries(SEED)){
    const r=await S.get('nx2_'+cid);
    if(!r||!JSON.parse(r).length){
      msgs[cid]=list.map((m,i)=>({id:cid+'_s'+i,sid:m.sid,text:m.text,ts:m.ts,read:true,tp:'text'}));
      await saveChat(cid);
    }
  }
  await S.set('nx2_seeded','1');
}

// ─── POLL ─────────────────────────────────────────
async function poll(){
  if(!ME||curScr==='login')return;
  // Update own heartbeat
  await S.set('nx2_online_'+ME, Date.now().toString());
  // Check who's online (active in last 30 seconds)
  const now=Date.now();
  onlineUsers.clear();
  for(const a of ACCOUNTS){
    if(a.id===ME){onlineUsers.add(ME);continue;}
    const t=await S.get('nx2_online_'+a.id);
    if(t&&now-parseInt(t)<30000)onlineUsers.add(a.id);
  }
  for(const c of CHATS){
    const r=await S.get('nx2_'+c.id);
    const fr=r?JSON.parse(r):[];
    const pv=msgs[c.id]||[];
    const changed=fr.length!==pv.length||JSON.stringify(fr.slice(-1))!==JSON.stringify(pv.slice(-1));
    if(changed){
      msgs[c.id]=fr;
      if(curScr==='chat'&&curChat===c.id)renderMsgs();
      else if(fr.length>pv.length){
        const last=fr[fr.length-1];
        if(last.sid!==ME){
          const preview=last.tp==='image'?'📷 Фото':last.text.substring(0,28)+(last.text.length>28?'…':'');
          toast(`${acc(last.sid)?.name} → ${cName(c,ME)}: ${preview}`);
        }
      }
      if(curScr==='chats')renderCL();
    }
  }
}
function startPoll(){if(pollId)clearInterval(pollId);pollId=setInterval(poll,1500)}

function renderCL(){

  if(!ME){el.innerHTML='';return;}
  let list=CHATS.filter(c=>c.members.includes(ME)&&cName(c,ME).toLowerCase().includes(srchQ));

  if(!list.length){el.innerHTML=`<div class="emp"><div class="ei">🔍</div><div class="et">Чаты не найдены</div></div>`;return;}
  el.innerHTML=list.map((c,i)=>{

    return `<div class="ci" onclick="openChat('${c.id}')">

function openChat(cid){
  curChat=cid;const c=chat(cid);const cl=cColor(c,ME);
  const ava=document.getElementById('ch-ava');
  ava.innerHTML='';ava.style.background=cl+'22';ava.style.fontSize='22px';ava.textContent=cEmoji(c,ME);
  if(c.type==='dm'){const otherId=c.members.find(m=>m!==ME);if(onlineUsers.has(otherId)){const d=document.createElement('div');d.className='dot';ava.appendChild(d);}}
  document.getElementById('ch-name').textContent=cName(c,ME);
  const st=document.getElementById('ch-status');
  if(c.type==='dm'){const otherId=c.members.find(m=>m!==ME);const isOn=onlineUsers.has(otherId);st.textContent=isOn?'онлайн':'не в сети';st.className=isOn?'hs on':'hs';}
  else{st.textContent=c.members.length+' участника';st.className='hs';}
  const m=msgs[cid]||[];let ch=false;
  m.forEach(x=>{if(x.sid!==ME&&!x.read){x.read=true;ch=true;}});
  if(ch)saveChat(cid);
  renderMsgs();go('chat');
}

// ─── RENDER MESSAGES ─────────────────────────────
function renderMsgs(){
  const el=document.getElementById('msg-list');
  const m=msgs[curChat]||[];const c=chat(curChat);
  if(!m.length){el.innerHTML=`<div class="empm"><div class="ei">💬</div><div class="et">Начните переписку!</div></div>`;return;}
  let html='',pd=null,ps=null;
  m.forEach((msg,i)=>{
    const isOut=msg.sid===ME;const a=acc(msg.sid);
    const nx=m[i+1];const isLast=!nx||nx.sid!==msg.sid;
    if(!pd||!sDay(pd,msg.ts)){html+=`<div class="dsep">${fmtD(msg.ts)}</div>`;pd=msg.ts;}
    if(c.type==='group'&&!isOut&&ps!==msg.sid)html+=`<div class="stag" style="color:${a?.color}">${a?.name}</div>`;
    const showAv=!isOut&&c.type==='group'&&isLast;
    const avH=!isOut&&c.type==='group'?`<div class="mav ${showAv?'':'inv'}" style="background:${a?.color}22">${showAv?a?.emoji:''}</div>`:'';
    const readAll=isOut&&(msg.read);
    const chk=readAll?'bck rd':'bck';
    let content='';
    if(msg.tp==='image'){
      const src=imgCache[msg.id]||msg.img||'';
      if(msg.img&&!imgCache[msg.id])imgCache[msg.id]=msg.img;
      content=`<div class="bub ibub" style="${isOut?'background:var(--msg-out)':'background:var(--msg-in)'};border-bottom-${isOut?'right':'left'}-radius:5px" onclick="openViewer('${msg.id}')">
        <img src="${src}" alt="Фото" loading="lazy">
        <div class="bm"><span>${fmtT(msg.ts)}</span>${isOut?`<span class="${chk}">${readAll?'✓✓':'✓'}</span>`:''}</div>
      </div>`;
    } else {
      content=`<div class="bub">
        ${esc(msg.text)}
        <div class="bm"><span>${fmtT(msg.ts)}</span>${isOut?`<span class="${chk}">${readAll?'✓✓':'✓'}</span>`:''}</div>
      </div>`;
    }
    html+=`<div class="mr ${isOut?'out':'in'}">${avH}${content}</div>`;
    ps=msg.sid;
  });
  const atBot=el.scrollTop+el.clientHeight>=el.scrollHeight-80;
  el.innerHTML=html;
  if(atBot||m[m.length-1]?.sid===ME)el.scrollTop=el.scrollHeight;
}

// ─── PHOTO SEND ──────────────────────────────────
function triggerPhoto(){document.getElementById('file-inp').click()}
function onFileSel(input){
  const file=input.files[0];if(!file)return;input.value='';
  if(!file.type.startsWith('image/')){toast('❌ Только изображения');return;}
  if(file.size>20*1024*1024){toast('❌ Файл слишком большой');return;}
  const ind=document.getElementById('up-ind');ind.style.display='flex';
  const reader=new FileReader();
  reader.onload=e=>compress(e.target.result,compressed=>{ind.style.display='none';sendPhoto(compressed);});
  reader.readAsDataURL(file);
}
function compress(dataUrl,cb){
  const img=new Image();
  img.onload=()=>{
    const MAX=900;let w=img.width,h=img.height;
    if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    cb(cv.toDataURL('image/jpeg',0.75));
  };img.src=dataUrl;
}
async function sendPhoto(b64){
  if(!curChat||!ME)return;
  const msg={id:Date.now()+'_'+Math.random().toString(36).substr(2,5),sid:ME,tp:'image',img:b64,text:'',ts:Date.now(),read:false};
  imgCache[msg.id]=b64;
  if(!msgs[curChat])msgs[curChat]=[];
  msgs[curChat].push(msg);
  await saveChat(curChat);
  renderMsgs();renderCL();
}
